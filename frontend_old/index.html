<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Simple Calculator</title><link rel="stylesheet" href="style.css"></head><body><div class="calculator"><input type="text" class="calculator-display" value="0" readonly><div class="calculator-buttons"><button class="operator" data-action="clear">C</button><button class="operator" data-action="divide">/</button><button class="operator" data-action="multiply">*</button><button class="operator" data-action="subtract">-</button><button>7</button><button>8</button><button>9</button><button>4</button><button>5</button><button>6</button><button class="operator" data-action="add">+</button><button>1</button><button>2</button><button>3</button><button class="decimal">.</button><button class="zero">0</button><button class="equals" data-action="calculate">=</button></div></div><script src="script.js"></script></body></html>
